<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qraft</title>
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!--
     * Monaco 编辑器内置样式 (~350KB):Tauri AMD loader (`public/monaco/loader.js`)
     * 只动态注入 `<script>` 标签,从不创建 `<style>` / `<link rel=stylesheet>`,
     * Monaco 自身的 `editor.main.js` 也未引用 `.css`,因此需要此处静态 link。
     *
     * - dev 模式下,vite dev server 仍按需注入,与 Monaco mount 后内部隐式 link
     *   在时序上恰好覆盖;prod 模式必须这里显式 link,否则编辑器完全无样式。
     * - SPA route base 通过 vite `BASE` 变量决定 dev 子路径;此处写 root 即可,
     *   Tauri 用 `tauri://localhost`/`tauri://` 静态根,`/monaco/...` 直接命中
     *   dist/monaco/... 复制产物。
     -->
    <link rel="stylesheet" href="/monaco/vs/editor/editor.main.css" />
    <!--
     * Monaco 0.56 min 构建缺少 codicon 图标基础样式(`.codicon` 基类规则 + codicon 字体),
     * 0.56 min/vs/editor/editor.main.css 只含 codicon 的 @font-face data URI,
     * 没有 `.codicon` 类(font-family / 图标 content 规则),导致 gutter 折叠 / 展开
     * 等图标显示为缺失字形占位(Windows 上为方框带 X)。
     *
     * 同步脚本 scripts/copy-monaco.mjs 会把 monaco-editor/esm/vs/base/.../codicon.css +
     * codicon.ttf 拷到 public/monaco/vs/base/browser/ui/codicons/codicon/,
     * 这里静态 link 即可让 prod 构建加载,无需等 component 模块副作用生效。
     -->
    <link rel="stylesheet" href="/monaco/vs/base/browser/ui/codicons/codicon/codicon.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
