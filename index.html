<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qraft</title>
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!--
     * Monaco 编辑器样式改为「非阻塞预取」:
     * - editor.main.css(~342KB)与 codicon.css 仅编辑器类工具需要,若以
     *   rel="stylesheet" 放这里会阻塞首屏渲染。rel="preload" as="style" 只提前
     *   取文件(本地磁盘,近零成本)不应用不阻塞;真正的注入发生在
     *   src/components/ui/code-editor.tsx 模块初始化(ensureMonacoStyles),
     *   早于任何 Monaco 组件挂载,且命中 preload 缓存即时生效。
     * - Tauri 用 tauri://localhost 静态根,/monaco/... 直接命中 dist/monaco/...
     *   复制产物;dev 由 vite dev server 按 public/ 路径提供。
     -->
    <link rel="preload" href="/monaco/vs/editor/editor.main.css" as="style" />
    <link rel="preload" href="/monaco/vs/base/browser/ui/codicons/codicon/codicon.css" as="style" />
    <!--
     * Monaco 中文本地化消息表(~41KB,由 scripts/copy-monaco.mjs 从
     * monaco-editor/min/vs/nls/lang/zh-cn.js 同步而来)。
     *
     * - 该文件是纯脚本:仅设置 globalThis._VSCODE_NLS_MESSAGES / _VSCODE_NLS_LANGUAGE,
     *   不含 AMD define()。Monaco 的 localize() 每次调用时懒读这个全局表,
     *   因此只需在任何 Monaco 模块求值前执行本脚本即可全量汉化
     *   (查找栏 / 折叠提示 / 命令面板等内置 UI)。
     * - 必须用经典 <script>(非 defer/async):经典脚本在解析阶段同步执行,
     *   严格早于 <body> 里的 module 脚本(React 入口),时序天然满足。
     * - 不要改回 require.config 的 'vs/nls'.availableLanguages 方案:
     *   vs/nls.messages-loader 插件会 AMD-require 本文件,但纯脚本无法注册为
     *   AMD 模块,require 回调永不触发,editor.main 将永久挂起(编辑器空白)。
     * - 404 时 localize 回退英文 fallback,不影响编辑器挂载。
     -->
    <script src="/monaco/vs/nls/lang/zh-cn.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
