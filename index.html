<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qraft</title>
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!--
     * Monaco 编辑器内置样式 (~350KB):Tauri AMD loader (`public/monaco/loader.js`)
     * 只动态注入 `<script>` 标签,从不创建 `<style>` / `<link rel=stylesheet>`,
     * Monaco 自身的 `editor.main.js` 也未引用 `.css`,因此需要此处静态 link。
     *
     * - dev 模式下,vite dev server 仍按需注入,与 Monaco mount 后内部隐式 link
     *   在时序上恰好覆盖;prod 模式必须这里显式 link,否则编辑器完全无样式。
     * - SPA route base 通过 vite `BASE` 变量决定 dev 子路径;此处写 root 即可,
     *   Tauri 用 `tauri://localhost`/`tauri://` 静态根,`/monaco/...` 直接命中
     *   dist/monaco/... 复制产物。
     -->
    <link rel="stylesheet" href="/monaco/vs/editor/editor.main.css" />
    <!--
     * Monaco 中文本地化消息表(~41KB,由 scripts/copy-monaco.mjs 从
     * monaco-editor/min/vs/nls/lang/zh-cn.js 同步而来)。
     *
     * - 该文件是纯脚本:仅设置 globalThis._VSCODE_NLS_MESSAGES / _VSCODE_NLS_LANGUAGE,
     *   不含 AMD define()。Monaco 的 localize() 每次调用时懒读这个全局表,
     *   因此只需在任何 Monaco 模块求值前执行本脚本即可全量汉化
     *   (查找栏 / 折叠提示 / 命令面板等内置 UI)。
     * - 必须用经典 <script>(非 defer/async):经典脚本在解析阶段同步执行,
     *   严格早于 <body> 里的 module 脚本(React 入口),时序天然满足。
     * - 不要改回 require.config 的 'vs/nls'.availableLanguages 方案:
     *   vs/nls.messages-loader 插件会 AMD-require 本文件,但纯脚本无法注册为
     *   AMD 模块,require 回调永不触发,editor.main 将永久挂起(编辑器空白)。
     * - 404 时 localize 回退英文 fallback,不影响编辑器挂载。
     -->
    <script src="/monaco/vs/nls/lang/zh-cn.js"></script>
    <!--
     * Monaco 0.56 min 构建缺少 codicon 图标基础样式(`.codicon` 基类规则 + codicon 字体),
     * 0.56 min/vs/editor/editor.main.css 只含 codicon 的 @font-face data URI,
     * 没有 `.codicon` 类(font-family / 图标 content 规则),导致 gutter 折叠 / 展开
     * 等图标显示为缺失字形占位(Windows 上为方框带 X)。
     *
     * 同步脚本 scripts/copy-monaco.mjs 会把 monaco-editor/esm/vs/base/.../codicon.css +
     * codicon.ttf 拷到 public/monaco/vs/base/browser/ui/codicons/codicon/,
     * 这里静态 link 即可让 prod 构建加载,无需等 component 模块副作用生效。
     -->
    <link rel="stylesheet" href="/monaco/vs/base/browser/ui/codicons/codicon/codicon.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
