[package]
name = "qraft"
version = "0.1.5"
description = "A local-first developer toolbox"
authors = ["Qraft Team"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "qraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# 单实例:防止重复启动;通过文件关联/命令行打开文件时,把路径转发给已运行实例
tauri-plugin-single-instance = "2"

# —— 以下为 Core 层新增依赖(Tauri 已有依赖保持不变)——
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
inventory = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
tokio-util = "0.7"
futures = "0.3"
directories = "5.0"
atomicwrites = "0.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# —— 工具实现依赖(05-p0-tools.md)——
base64 = "0.22"
url = "2.5"
jsonwebtoken = "9.3"
sha2 = "0.10"
sha3 = "0.10"
sha1 = "0.10"
blake3 = "1.5"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
regex = "1.10"
percent-encoding = "2.3"
async-stream = "0.3"
# 编辑器文件编码检测/转换(UTF-8/GBK/Big5/Shift-JIS/Windows-1252/UTF-16)
encoding_rs = "0.8"

# —— 图片处理(PNG 压缩工具)——
# PNG 解码/编码(png crate 支持 Indexed 调色板输出,用于有损量化)
png = "0.17"
# OxiPNG 无损优化(参考 DevToys.PngCompressor 的 OxiPNG 通道)
oxipng = { version = "9", default-features = false, features = ["parallel", "zopfli"] }

# 网络访问策略(见 13-security.md §3.1):
#   零网络原则下仅允许两类例外:
#   1. 自动更新 —— tauri-plugin-updater
#   2. IP 归属地查询(P0 后新增,用户手动触发)—— 下方 ureq,
#      仅允许访问 src-tauri/src/net/ip_lookup.rs 中硬编码白名单域名
#      (ip-api.com / flagcdn.com);除此之外 tauri-plugin-http /
#      reqwest / ureq 等一律禁止引入。
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }

# 桌面端云母 / vibrancy 材质(Windows apply_mica / macOS apply_vibrancy;
# Linux 无原生支持,自动 no-op,由前端 CSS backdrop-filter 回退)
window-vibrancy = "0.8"

# Windows 平台:DirectWrite 系统字体枚举 + ShellExecuteW 打开默认文件管理器
# + 注册表检测默认文件管理器(仅 Windows target 引入;
# Win32_UI_Shell 提供 ShellExecuteW, Win32_UI_WindowsAndMessaging 提供 SW_SHOWNORMAL,
# Win32_System_Registry 提供 RegOpenKeyExW 等)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "json_formatter"
harness = false

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
# catch_unwind panic 隔离(executor 三重保护)要求 unwind,不可改为 abort
panic = "unwind"
# 体积与运行性能优化:thin LTO + 单 codegen unit + 符号剥离。
# 安装包体积目标(<30MB)由前端 dist 与 Rust 二进制共同决定,
# 未优化 profile 会让二进制多出数 MB;编译时间上升是可接受代价
lto = "thin"
codegen-units = 1
strip = "symbols"
