[package]
name = "qraft"
version = "0.1.0"
description = "A local-first developer toolbox"
authors = ["Qraft Team"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "qraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# —— 以下为 Core 层新增依赖(Tauri 已有依赖保持不变)——
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
inventory = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
tokio-util = "0.7"
futures = "0.3"
directories = "5.0"
atomicwrites = "0.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# —— 工具实现依赖(05-p0-tools.md)——
base64 = "0.22"
url = "2.5"
jsonwebtoken = "9.3"
sha2 = "0.10"
sha3 = "0.10"
sha1 = "0.10"
blake3 = "1.5"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
regex = "1.10"
percent-encoding = "2.3"
async-stream = "0.3"

# 禁止引入网络相关 crate(见 13-security.md §3.1):
#   tauri-plugin-http / reqwest / ureq —— 均不允许

# Windows 平台:DirectWrite 系统字体枚举(仅 Windows target 引入)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
