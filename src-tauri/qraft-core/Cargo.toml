[package]
name = "qraft-core"
version = "0.3.8"
edition = "2024"
rust-version = "1.90"
description = "Qraft tool engine: pure-function tools, inventory registry and executor (Tauri-free)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
encoding_rs = "0.8"
futures = "0.3"
hex = "0.4"
inventory = "0.3"
md-5 = "0.10"
parking_lot = "0.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
# preserve_order:Map 用 IndexMap 保插入序,与前端 JSON.stringify 行为一致
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
taplo = { version = "0.14.0", default-features = false }
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
