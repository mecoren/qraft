name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs from the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Frontend format check
        run: pnpm prettier --check "src/**/*.{ts,tsx,css}"

      - name: Frontend lint
        run: pnpm lint

  test:
    name: Test (Rust + Frontend)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust test
        working-directory: ./src-tauri
        run: cargo test --locked

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend unit test
        run: pnpm test

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-2022
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            os: windows-2022
            arch: arm64
            rust-target: aarch64-pc-windows-msvc
          # macOS
          - platform: macos
            os: macos-latest
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: arm64
            rust-target: aarch64-apple-darwin
          # Linux
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            os: ubuntu-22.04-arm
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Linux arm64 linker
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> src-tauri/target
          cache-on-failure: true

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.rust-target }} --verbose

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        working-directory: ./src-tauri
        env:
          # 必须 >=0.22:advisory-db 已含 CVSS 4.0 条目(RUSTSEC-2026-0038),
          # 0.21.x 的 cvss 库无法解析会直接报错。0.22.2 为当前最新稳定版。
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          set -euo pipefail
          # 固定版本安装,避免复用缓存中不可控的旧二进制导致行为不可复现。
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

          # cargo-audit 在解析 Cargo.lock 后,会向 target/ 目录写入缓存/SBOM。
          # CI fresh checkout 后 src-tauri/target 不存在(被 gitignore),
          # 导致写入失败并以 "Couldn't load Cargo.lock" 误报。显式创建目录。
          mkdir -p target

          # quick-xml 的两条高危 advisory 在此行内豁免(0.22.2 不支持 --config,
          # 且默认配置查找可能被 $CARGO_HOME/audit.toml 抢占,故不用 audit.toml)。
          # src-tauri/audit.toml 中的同名豁免保留,待未来版本支持 --config 时启用。
          # 用绝对路径 --file 指向 src-tauri/Cargo.lock,避免任何目录解析歧义。
          cargo audit \
            --file "$(pwd)/Cargo.lock" \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

      - name: pnpm audit (生产依赖)
        # 安全底线(prd/13-security.md):与 cargo audit 同级的强制门禁。
        # --prod 只审计 dependencies;阈值 moderate 与 cargo audit 拦截口径对齐。
        run: pnpm audit --prod --audit-level moderate
