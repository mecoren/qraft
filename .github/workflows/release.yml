name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs from the same ref to save CI minutes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        working-directory: ./src-tauri
        env:
          # 必须 >=0.22:advisory-db 已含 CVSS 4.0 条目(RUSTSEC-2026-0038),
          # 0.21.x 的 cvss 库无法解析会直接报错。0.22.2 为当前最新稳定版。
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          set -euo pipefail
          # 固定版本安装,避免复用缓存中不可控的旧二进制导致行为不可复现。
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

          # cargo-audit 在解析 Cargo.lock 后,会向 target/ 目录写入缓存/SBOM。
          # CI fresh checkout 后 src-tauri/target 不存在(被 gitignore),
          # 导致写入失败并以 "Couldn't load Cargo.lock" 误报。显式创建目录。
          mkdir -p target

          # 注意:不使用 --deny warnings。GTK3 绑定(atk/gdk/gtk 0.18.x)的
          # unmaintained 与 glib 的 unsound 均来自 Tauri Linux 后端锁死的传递依赖,
          # 项目层无法升级(需等 Tauri 上游),详见 src-tauri/audit.toml 注释。
          # 真实 vulnerabilities 仍会使 audit 以非零码退出,拦截能力不受影响。
          # quick-xml 两条高危 advisory 已在 src-tauri/audit.toml 中豁免。
          # 用绝对路径 --file 指向 src-tauri/Cargo.lock,避免任何目录解析歧义。
          cargo audit --file "$(pwd)/Cargo.lock"

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: [audit]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-2022
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            os: windows-2022
            arch: arm64
            rust-target: aarch64-pc-windows-msvc
          # macOS
          - platform: macos
            os: macos-latest
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: arm64
            rust-target: aarch64-apple-darwin
          # Linux
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            os: ubuntu-22.04-arm
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Linux arm64 linker
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: (macOS) Import signing certificate
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_CERT != ''
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
        run: |
          echo "Signing certificate detected; configure notarization in tauri.conf.json to enable it."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> src-tauri/target
          cache-on-failure: true

      - name: Generate SBOM (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cargo install cargo-cyclonedx --locked || true
          cd src-tauri
          cargo cyclonedx --all --format json --output ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || true

      - name: Generate SBOM (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          cd src-tauri
          cargo cyclonedx --all --format json --output ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.rust-target }} --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qraft-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*
            sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: qraft-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
