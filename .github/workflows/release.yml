name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing (only produces artifacts)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs from the same ref to save CI minutes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:默认只读,build(publish) 与 publish-extras 需要写 Release 时在 job 级显式提权。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        working-directory: ./src-tauri
        env:
          # 必须 >=0.22:advisory-db 已含 CVSS 4.0 条目(RUSTSEC-2026-0038),
          # 0.21.x 的 cvss 库无法解析会直接报错。0.22.2 为当前最新稳定版。
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          set -euo pipefail
          # 固定版本安装,避免复用缓存中不可控的旧二进制导致行为不可复现。
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

          # cargo-audit 在解析 Cargo.lock 后,会向 target/ 目录写入缓存/SBOM。
          # CI fresh checkout 后 src-tauri/target 不存在(被 gitignore),
          # 导致写入失败并以 "Couldn't load Cargo.lock" 误报。显式创建目录。
          mkdir -p target

          # 注意:不使用 --deny warnings。GTK3 绑定(atk/gdk/gtk 0.18.x)的
          # unmaintained 与 glib 的 unsound 均来自 Tauri Linux 后端锁死的传递依赖,
          # 项目层无法升级(需等 Tauri 上游),详见 src-tauri/audit.toml 注释。
          # 真实 vulnerabilities 仍会使 audit 以非零码退出,拦截能力不受影响。
          # quick-xml 的两条高危 advisory 在此行内豁免(0.22.2 不支持 --config,
          # 且默认配置查找可能被 $CARGO_HOME/audit.toml 抢占,故不用 audit.toml)。
          # src-tauri/audit.toml 中的同名豁免保留,待未来版本支持 --config 时启用。
          # 用绝对路径 --file 指向 src-tauri/Cargo.lock,避免任何目录解析歧义。
          cargo audit \
            --file "$(pwd)/Cargo.lock" \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

      - name: pnpm audit (生产依赖)
        # 安全底线(prd/13-security.md):与 cargo audit 同级的强制门禁。
        # --prod 只审计 dependencies;阈值 moderate 与 cargo audit 拦截口径对齐。
        run: pnpm audit --prod --audit-level moderate

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-2022
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            os: windows-2022
            arch: arm64
            rust-target: aarch64-pc-windows-msvc
          # macOS
          - platform: macos
            os: macos-latest
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: arm64
            rust-target: aarch64-apple-darwin
          # Linux
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            os: ubuntu-22.04-arm
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      # tauri-action 在 tag 推送时创建 Release 并上传资产(latest.json + .sig);
      # dry-run(workflow_dispatch)时仅构建,不触发写操作。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Linux arm64 linker
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> src-tauri/target
          cache-on-failure: true

      - name: Generate SBOM (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cargo install cargo-cyclonedx --locked || true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || true

      - name: Generate SBOM (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked || $true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || $true

      # ──────────────────────────────────────────────────────────────────────
      # tauri-action:构建 + (tag 时)创建 Release 并上传资产。
      #
      # - tagName 为空(workflow_dispatch / dry-run)时只构建、不发布;
      # - includeUpdaterJson 生成 latest.json 并跨矩阵运行合并(全平台共享一份);
      # - updater 托管产物使用 Tauri 默认命名 —— manifest 内的下载 URL 必须与
      #   Release 资产名逐字节一致,自定义重命名会导致 404(见 prd/
      #   updater-tauri-action-migration/design.md §3);
      # - TAURI_SIGNING_PRIVATE_KEY 缺失时构建直接失败(预期保护),须先在
      #   repo Secrets 配置签名私钥。
      # ──────────────────────────────────────────────────────────────────────
      # 临时诊断:确认 Secret 是否注入到构建环境(只输出长度,不泄露内容)。
      # 定位 "no private key" 报错是 Secret 配置问题还是 tauri-action 层问题。
      - name: Debug signing key presence
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "key present, length=${#TAURI_SIGNING_PRIVATE_KEY}"
          else
            echo "key MISSING or EMPTY"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          args: --target ${{ matrix.rust-target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && github.ref_name || '' }}
          releaseName: 'Qraft ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true

      # ──────────────────────────────────────────────────────────────────────
      # Windows Portable:tauri-action 不产便携版。复用 target/<triple>/release
      # 下的 raw exe 压包(不加目录壳,避免 zip-slip 风险),经 artifact 转交
      # publish-extras 追加到 Release;该资产不参与 updater manifest。
      # ──────────────────────────────────────────────────────────────────────
      - name: Package Portable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 版本号取自 tauri.conf.json,保证与产物/latest.json 一致(tag 名与本地 conf 可能脱节)
          $ver = ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)

          $rustTarget = '${{ matrix.rust-target }}'
          $releaseDir = "src-tauri/target/$rustTarget/release"
          $exe = @("$releaseDir/Qraft.exe", "$releaseDir/qraft.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No Qraft exe found under $releaseDir" }

          $arch = if ('${{ matrix.arch }}' -eq 'x64') { 'Amd64' } else { 'Arm64' }
          $base = "Qraft-$ver-Windows-$arch"
          New-Item -ItemType Directory -Force -Path extras/portable | Out-Null

          Copy-Item $exe "extras/portable/$base-Portable.exe"
          Compress-Archive -Path $exe -DestinationPath "extras/portable/$base-Portable.zip" -Force

          Get-ChildItem extras/portable | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: qraft-portable-${{ matrix.arch }}
          path: extras/portable/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM artifact
        if: hashFiles(format('sbom-{0}-{1}.cdx.json', matrix.platform, matrix.arch)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: qraft-sbom-${{ matrix.platform }}-${{ matrix.arch }}
          path: sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # publish-extras:tag 且非 dry-run 时,把 SBOM 与 Portable 等非 updater 资产
  # 追加到 tauri-action 已创建的 Release(softprops 按 tag 定位既有 Release,
  # 上传同名/新文件均为增量添加,不影响 latest.json 引用的资产)。
  # ──────────────────────────────────────────────────────────────────────────
  publish-extras:
    name: Publish extra assets
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download extra artifacts
        uses: actions/download-artifact@v6
        with:
          path: extras
          # 单一 glob(brace 展开):Portable 与 SBOM 全部落到 extras/ 根目录
          pattern: qraft-{portable,sbom}-*
          merge-multiple: true

      - name: Append files to release
        uses: softprops/action-gh-release@v3
        with:
          files: extras/**/*
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
