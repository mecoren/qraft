name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing (only produces artifacts)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs from the same ref to save CI minutes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:默认只读,build(publish) 与 publish-extras 需要写 Release 时在 job 级显式提权。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        working-directory: ./src-tauri
        env:
          # 必须 >=0.22:advisory-db 已含 CVSS 4.0 条目(RUSTSEC-2026-0038),
          # 0.21.x 的 cvss 库无法解析会直接报错。0.22.2 为当前最新稳定版。
          CARGO_AUDIT_VERSION: '0.22.2'
        run: |
          set -euo pipefail
          # 固定版本安装,避免复用缓存中不可控的旧二进制导致行为不可复现。
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

          # cargo-audit 在解析 Cargo.lock 后,会向 target/ 目录写入缓存/SBOM。
          # CI fresh checkout 后 src-tauri/target 不存在(被 gitignore),
          # 导致写入失败并以 "Couldn't load Cargo.lock" 误报。显式创建目录。
          mkdir -p target

          # 注意:不使用 --deny warnings。GTK3 绑定(atk/gdk/gtk 0.18.x)的
          # unmaintained 与 glib 的 unsound 均来自 Tauri Linux 后端锁死的传递依赖,
          # 项目层无法升级(需等 Tauri 上游),详见 src-tauri/audit.toml 注释。
          # 真实 vulnerabilities 仍会使 audit 以非零码退出,拦截能力不受影响。
          # quick-xml 的两条高危 advisory 在此行内豁免(0.22.2 不支持 --config,
          # 且默认配置查找可能被 $CARGO_HOME/audit.toml 抢占,故不用 audit.toml)。
          # src-tauri/audit.toml 中的同名豁免保留,待未来版本支持 --config 时启用。
          # 用绝对路径 --file 指向 src-tauri/Cargo.lock,避免任何目录解析歧义。
          cargo audit \
            --file "$(pwd)/Cargo.lock" \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

      - name: pnpm audit (生产依赖)
        # 安全底线(prd/13-security.md):与 cargo audit 同级的强制门禁。
        # --prod 只审计 dependencies;阈值 moderate 与 cargo audit 拦截口径对齐。
        run: pnpm audit --prod --audit-level moderate

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-2022
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            os: windows-2022
            arch: arm64
            rust-target: aarch64-pc-windows-msvc
          # macOS
          - platform: macos
            os: macos-latest
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: arm64
            rust-target: aarch64-apple-darwin
          # Linux
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            os: ubuntu-22.04-arm
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      # tauri-action 在 tag 推送时创建 Release 并上传资产(latest.json + .sig);
      # dry-run(workflow_dispatch)时仅构建,不触发写操作。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Linux arm64 linker
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> src-tauri/target
          cache-on-failure: true

      - name: Generate SBOM (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cargo install cargo-cyclonedx --locked || true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || true

      - name: Generate SBOM (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked || $true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || $true

      # ──────────────────────────────────────────────────────────────────────
      # tauri-action:构建 + (tag 时)创建 Release 并上传资产。
      #
      # - tagName 为空(workflow_dispatch / dry-run)时只构建、不发布;
      # - includeUpdaterJson 恒 false:latest.json 是全平台共享的单一份,6 个
      #   矩阵 job 并发「下载 manifest → 合并本平台 → PATCH 回写」构成读-改-写
      #   竞态,PATCH 会命中已被并发 job 删改的 asset id 而 404。改由
      #   publish-updater-manifest 在 build 全部结束后单点生成;
      # - 本步只上传各平台自身的安装包与 .sig:文件名互不重叠,可安全并发;
      # - TAURI_SIGNING_PRIVATE_KEY 缺失时构建直接失败(预期保护),须先在
      #   repo Secrets 配置签名私钥。
      # ──────────────────────────────────────────────────────────────────────
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          args: --target ${{ matrix.rust-target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && github.ref_name || '' }}
          releaseName: 'Qraft ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false

      # ──────────────────────────────────────────────────────────────────────
      # Windows Portable:tauri-action 不产便携版。复用 target/<triple>/release
      # 下的 raw exe 压包(不加目录壳,避免 zip-slip 风险),经 artifact 转交
      # publish-extras 追加到 Release;该资产不参与 updater manifest。
      # ──────────────────────────────────────────────────────────────────────
      - name: Package Portable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 版本号取自 tauri.conf.json,保证与产物/latest.json 一致(tag 名与本地 conf 可能脱节)
          $ver = ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)

          $rustTarget = '${{ matrix.rust-target }}'
          $releaseDir = "src-tauri/target/$rustTarget/release"
          $exe = @("$releaseDir/Qraft.exe", "$releaseDir/qraft.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No Qraft exe found under $releaseDir" }

          $arch = if ('${{ matrix.arch }}' -eq 'x64') { 'Amd64' } else { 'Arm64' }
          $base = "Qraft-$ver-Windows-$arch"
          New-Item -ItemType Directory -Force -Path extras/portable | Out-Null

          Copy-Item $exe "extras/portable/$base-Portable.exe"
          Compress-Archive -Path $exe -DestinationPath "extras/portable/$base-Portable.zip" -Force

          Get-ChildItem extras/portable | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: qraft-portable-${{ matrix.arch }}
          path: extras/portable/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM artifact
        if: hashFiles(format('sbom-{0}-{1}.cdx.json', matrix.platform, matrix.arch)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: qraft-sbom-${{ matrix.platform }}-${{ matrix.arch }}
          path: sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # publish-updater-manifest:tag 且非 dry-run 时,在矩阵全部构建完成后单点
  # 生成 updater manifest 并上传。
  #
  # 为什么不放回 tauri-action:latest.json 全平台共享一份,而矩阵 6 个 job 并行,
  # 各自「下载 manifest → 合并本平台 → PATCH 回写」构成读-改-写竞态,PATCH 常
  # 命中已被并发 job 删改的 asset id → 404(update-a-release-asset)。此处改为
  # 读取各平台已上传的 .sig 内容自行合成,只有本作业写 manifest,竞态消除。
  #
  # URL 直接写规范化后的资产名(normalize-assets 随后把资产改成同名),故本作业
  # 必须先于 normalize-assets 执行;两者共用 scripts/release-asset-map.sh 的
  # 映射,保证 URL 与资产名逐字节一致。
  # ──────────────────────────────────────────────────────────────────────────
  publish-updater-manifest:
    name: Publish updater manifest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 版本号取自 tauri.conf.json(与 Portable 打包同源),避免 tag 名脱节
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)

          # 全程 Release ID 路由:删 tag 会把 Release 转为 draft,而
          # /releases/tags/{tag} 与 tag 型下载 URL 对 draft 均 404
          API="repos/{owner}/{repo}"
          RELEASE_ID=$(gh api "$API/releases" --paginate |
            jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: no release found for tag $TAG" >&2
            exit 1
          fi
          echo "release id: $RELEASE_ID"

          source scripts/release-asset-map.sh
          mapfile -t MAP_SED < <(release_asset_map_sed "$VER")
          mapfile -t ENTRIES < <(release_updater_entries "$VER")

          # 现有资产名 → id(供按名取 .sig 内容)
          declare -A ASSET_ID
          while IFS=$'\t' read -r aid aname; do ASSET_ID["$aname"]="$aid"; done < <(
            gh api "$API/releases/$RELEASE_ID/assets" --paginate |
              jq -r '.[] | "\(.id)\t\(.name)"'
          )

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          PLATFORMS='{}'

          for entry in "${ENTRIES[@]}"; do
            key="${entry%%|*}"
            sig_name="${entry#*|}"
            sig_id="${ASSET_ID[$sig_name]:-}"
            if [ -z "$sig_id" ] || [ "$sig_id" = "null" ]; then
              echo "WARN: signature asset missing, skip: $key ($sig_name)" >&2
              continue
            fi
            sig=$(gh api "$API/releases/assets/$sig_id" \
                    -H "Accept: application/octet-stream" | tr -d '[:space:]')
            # .sig 名去掉后缀即产物原名,再套改名映射得到规范化资产名
            asset_name=$(printf '%s' "${sig_name%.sig}" | sed "${MAP_SED[@]}")
            PLATFORMS=$(jq -n --argjson p "$PLATFORMS" --arg k "$key" \
                          --arg s "$sig" --arg u "$BASE_URL/$asset_name" \
              '$p + { ($k): { signature: $s, url: $u } }')
            echo "entry: $key -> $asset_name"
          done

          COUNT=$(echo "$PLATFORMS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no platform resolved; refusing to publish empty manifest" >&2
            exit 1
          fi

          jq -n --arg v "$VER" --argjson p "$PLATFORMS" \
            '{ version: $v,
               notes: "See the assets below to download and install this version.",
               pub_date: (now | strftime("%Y-%m-%dT%H:%M:%S.000Z")),
               platforms: $p }' > latest.json

          echo "---- manifest ($COUNT platforms) ----"
          jq -r '.platforms | to_entries[] | "\(.key): \(.value.url)"' latest.json

          # 上传:崩溃安全三步(临时名 → 删旧 → 改名),任一步失败新旧 manifest
          # 至少存活一个,重跑可恢复。上传端点只在 uploads.github.com,
          # gh api 走 api.github.com 对该端点恒 404,必须 curl 直传。
          TMP_NAME="latest.json.new"
          TMP_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
            jq -r --arg n "$TMP_NAME" '[.[] | select(.name == $n)][0].id')
          if [ -n "$TMP_ID" ] && [ "$TMP_ID" != "null" ]; then
            gh api -X DELETE "$API/releases/assets/$TMP_ID" >/dev/null
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$TMP_NAME" >/dev/null
          CUR_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
            jq -r '[.[] | select(.name == "latest.json")][0].id')
          if [ -n "$CUR_ID" ] && [ "$CUR_ID" != "null" ]; then
            gh api -X DELETE "$API/releases/assets/$CUR_ID" >/dev/null
          fi
          NEW_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
            jq -r --arg n "$TMP_NAME" '[.[] | select(.name == $n)][0].id')
          gh api -X PATCH "$API/releases/assets/$NEW_ID" -f name="latest.json" >/dev/null
          echo "uploaded latest.json"

  # ──────────────────────────────────────────────────────────────────────────
  # publish-extras:tag 且非 dry-run 时,把 SBOM 与 Portable 等非 updater 资产
  # 追加到 tauri-action 已创建的 Release(softprops 按 tag 定位既有 Release,
  # 上传同名/新文件均为增量添加,不影响 latest.json 引用的资产)。
  # ──────────────────────────────────────────────────────────────────────────
  publish-extras:
    name: Publish extra assets
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download extra artifacts
        uses: actions/download-artifact@v6
        with:
          path: extras
          # 单一 glob(brace 展开):Portable 与 SBOM 全部落到 extras/ 根目录
          pattern: qraft-{portable,sbom}-*
          merge-multiple: true

      # 不用 action-gh-release——GitHub 同一 tag 只允许一个非草稿 Release,该
      # Action 在 tag 被强移后(与 Release.target_commitish 脱节)会走
      # create/update-a-release 兜底,把 tauri-action 已发布的 Release 挤成
      # draft,导致公开下载 404 与后续作业连锁失败。元数据走 gh api(Release ID
      # 路由),资产上传走 curl 直传 uploads.github.com(gh api 不支持该域名)。
      - name: Append files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          API="repos/{owner}/{repo}"

          RELEASE_ID=$(gh api "$API/releases" --paginate |
            jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: no release found for tag $TAG" >&2
            exit 1
          fi

          shopt -s nullglob
          for f in extras/*; do
            base=$(basename "$f")
            # GitHub 对同名上传是删旧建新;显式先删避免依赖隐式替换语义
            OLD_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
              jq -r --arg n "$base" '[.[] | select(.name == $n)][0].id')
            if [ -n "$OLD_ID" ] && [ "$OLD_ID" != "null" ]; then
              gh api -X DELETE "$API/releases/assets/$OLD_ID" >/dev/null
              echo "removed old: $base"
            fi
            # 上传端点只存在于 uploads.github.com,gh api 只走 api.github.com,
            # 对该端点裸 POST 恒 404,必须用 curl 直传 uploads 域名
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$base" >/dev/null
            echo "uploaded: $base"
          done

  # ──────────────────────────────────────────────────────────────────────────
  # normalize-assets:tag 且非 dry-run 时,统一 Release 资产命名
  # (设计见 prd/asset-naming-normalization/design.md)。
  #
  # 改名映射与 publish-updater-manifest 共用 scripts/release-asset-map.sh:
  # manifest 的下载 URL 已按同一映射写成规范化名,本作业把资产改成同名,两者
  # 由此逐字节对齐,无需再回写 manifest(故 needs 该作业,而非 build)。
  #
  # msi/rpm 已从 bundle.targets 移除,存量资产在此删除;.sig 签名文件同样在此
  # 删除——签名内容已内联在 latest.json 的 signature 字段,updater 校验只依赖
  # manifest,而 manifest 已在本作业之前生成完毕。
  # Portable / SBOM / latest.json 本身不改名。
  # ──────────────────────────────────────────────────────────────────────────
  normalize-assets:
    name: Normalize release asset names
    needs: [publish-updater-manifest]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          # 版本号取自 tauri.conf.json(与 Windows Portable 打包同源),
          # 避免本地 conf 与 tag 名脱节导致映射落空。
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)

          # 旧名 → 新名映射,单一事实来源(与 manifest 生成共用):
          # sed 对主文件名与配套 .sig 同样生效;darwin 更新产物名不带版本号。
          source scripts/release-asset-map.sh
          mapfile -t MAP_SED < <(release_asset_map_sed "$VER")

          # 全程走 Release ID 路由:删 tag 会把既有 Release 转为 draft,而
          # /releases/tags/{tag} 与 tag 型公开下载 URL 对 draft 均不可用(404),
          # 只有 /releases 列表能按 tag_name 命中 draft。资产增删改同理必须用
          # releases/{id}/assets 与 releases/assets/{asset_id} 端点。
          API="repos/{owner}/{repo}"

          RELEASE_ID=$(gh api "$API/releases" --paginate |
            jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: no release found for tag $TAG" >&2
            exit 1
          fi
          echo "release id: $RELEASE_ID"

          # 1) 资产改名(PATCH API 直接改,免重传);msi/rpm 不再产出,直接删除;
          #    .sig 签名文件无需作为 Release 资产公开(签名内容已内联在 latest.json
          #    的 signature 字段,updater 校验只依赖 manifest),一并删除以精简资产列表。
          # 先建 现有名 → id 映射:重跑场景下目标名可能已被上一轮占用
          # (GitHub PATCH 重名报 422),改前需先删掉旧的同名资产。
          declare -A EXISTING
          while IFS=$'\t' read -r aid aname; do EXISTING["$aname"]="$aid"; done < <(
            gh api "$API/releases/$RELEASE_ID/assets" --paginate |
              jq -r '.[] | "\(.id)\t\(.name)"'
          )

          for aname in "${!EXISTING[@]}"; do
            id="${EXISTING[$aname]}"
            new_name=$(printf '%s' "$aname" | sed "${MAP_SED[@]}")
            case "$new_name" in
              # .sig 覆盖所有平台的签名文件(含存量 .msi.sig/.rpm.sig)
              *.sig)
                gh api -X DELETE "$API/releases/assets/$id" >/dev/null
                echo "deleted sig: $aname"
                ;;
              *.msi|*.rpm)
                gh api -X DELETE "$API/releases/assets/$id" >/dev/null
                echo "deleted: $aname"
                ;;
              "$aname")
                echo "keep:    $aname"
                ;;
              *)
                if [ -n "${EXISTING[$new_name]:-}" ] && [ "${EXISTING[$new_name]}" != "$id" ]; then
                  gh api -X DELETE "$API/releases/assets/${EXISTING[$new_name]}" >/dev/null
                  echo "replaced stale: $new_name"
                fi
                gh api -X PATCH "$API/releases/assets/$id" -f name="$new_name" >/dev/null
                echo "renamed: $aname -> $new_name"
                ;;
            esac
          done

          # 2) 兜底确保发布态(幂等):tauri-action 命中已存在的 draft 时只上传
          #    资产不会反草稿化。失败不阻断(资产已就绪),但告警提示人工检查。
          if ! gh api -X PATCH "$API/releases/$RELEASE_ID" \
               -f draft=false -f prerelease=false > /dev/null; then
            echo "WARN: failed to enforce published state; check release visibility" >&2
          fi
