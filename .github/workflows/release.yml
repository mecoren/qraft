name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing (only produces artifacts)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs from the same ref to save CI minutes.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:默认只读,build(publish) 与 publish-extras 需要写 Release 时在 job 级显式提权。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        working-directory: ./src-tauri
        env:
          # 必须 >=0.22:advisory-db 已含 CVSS 4.0 条目(RUSTSEC-2026-0038),
          # 0.21.x 的 cvss 库无法解析会直接报错。0.22.2 为当前最新稳定版。
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          set -euo pipefail
          # 固定版本安装,避免复用缓存中不可控的旧二进制导致行为不可复现。
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

          # cargo-audit 在解析 Cargo.lock 后,会向 target/ 目录写入缓存/SBOM。
          # CI fresh checkout 后 src-tauri/target 不存在(被 gitignore),
          # 导致写入失败并以 "Couldn't load Cargo.lock" 误报。显式创建目录。
          mkdir -p target

          # 注意:不使用 --deny warnings。GTK3 绑定(atk/gdk/gtk 0.18.x)的
          # unmaintained 与 glib 的 unsound 均来自 Tauri Linux 后端锁死的传递依赖,
          # 项目层无法升级(需等 Tauri 上游),详见 src-tauri/audit.toml 注释。
          # 真实 vulnerabilities 仍会使 audit 以非零码退出,拦截能力不受影响。
          # quick-xml 的两条高危 advisory 在此行内豁免(0.22.2 不支持 --config,
          # 且默认配置查找可能被 $CARGO_HOME/audit.toml 抢占,故不用 audit.toml)。
          # src-tauri/audit.toml 中的同名豁免保留,待未来版本支持 --config 时启用。
          # 用绝对路径 --file 指向 src-tauri/Cargo.lock,避免任何目录解析歧义。
          cargo audit \
            --file "$(pwd)/Cargo.lock" \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

      - name: pnpm audit (生产依赖)
        # 安全底线(prd/13-security.md):与 cargo audit 同级的强制门禁。
        # --prod 只审计 dependencies;阈值 moderate 与 cargo audit 拦截口径对齐。
        run: pnpm audit --prod --audit-level moderate

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-2022
            arch: x64
            rust-target: x86_64-pc-windows-msvc
          - platform: windows
            os: windows-2022
            arch: arm64
            rust-target: aarch64-pc-windows-msvc
          # macOS
          - platform: macos
            os: macos-latest
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: macos
            os: macos-latest
            arch: arm64
            rust-target: aarch64-apple-darwin
          # Linux
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: linux
            os: ubuntu-22.04-arm
            arch: arm64
            rust-target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      # tauri-action 在 tag 推送时创建 Release 并上传资产(latest.json + .sig);
      # dry-run(workflow_dispatch)时仅构建,不触发写操作。
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Linux arm64 linker
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> src-tauri/target
          cache-on-failure: true

      - name: Generate SBOM (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cargo install cargo-cyclonedx --locked || true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || true

      - name: Generate SBOM (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked || $true
          cd src-tauri
          cargo cyclonedx --all --format json --override-filename ../sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json || $true

      # ──────────────────────────────────────────────────────────────────────
      # tauri-action:构建 + (tag 时)创建 Release 并上传资产。
      #
      # - tagName 为空(workflow_dispatch / dry-run)时只构建、不发布;
      # - includeUpdaterJson 生成 latest.json 并跨矩阵运行合并(全平台共享一份);
      # - TAURI_SIGNING_PRIVATE_KEY 缺失时构建直接失败(预期保护),须先在
      #   repo Secrets 配置签名私钥。
      # ──────────────────────────────────────────────────────────────────────
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          args: --target ${{ matrix.rust-target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true && github.ref_name || '' }}
          releaseName: 'Qraft ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true

      # ──────────────────────────────────────────────────────────────────────
      # Windows Portable:tauri-action 不产便携版。复用 target/<triple>/release
      # 下的 raw exe 压包(不加目录壳,避免 zip-slip 风险),经 artifact 转交
      # publish-extras 追加到 Release;该资产不参与 updater manifest。
      # ──────────────────────────────────────────────────────────────────────
      - name: Package Portable (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 版本号取自 tauri.conf.json,保证与产物/latest.json 一致(tag 名与本地 conf 可能脱节)
          $ver = ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)

          $rustTarget = '${{ matrix.rust-target }}'
          $releaseDir = "src-tauri/target/$rustTarget/release"
          $exe = @("$releaseDir/Qraft.exe", "$releaseDir/qraft.exe") |
                 Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No Qraft exe found under $releaseDir" }

          $arch = if ('${{ matrix.arch }}' -eq 'x64') { 'Amd64' } else { 'Arm64' }
          $base = "Qraft-$ver-Windows-$arch"
          New-Item -ItemType Directory -Force -Path extras/portable | Out-Null

          Copy-Item $exe "extras/portable/$base-Portable.exe"
          Compress-Archive -Path $exe -DestinationPath "extras/portable/$base-Portable.zip" -Force

          Get-ChildItem extras/portable | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: qraft-portable-${{ matrix.arch }}
          path: extras/portable/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM artifact
        if: hashFiles(format('sbom-{0}-{1}.cdx.json', matrix.platform, matrix.arch)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: qraft-sbom-${{ matrix.platform }}-${{ matrix.arch }}
          path: sbom-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # publish-extras:tag 且非 dry-run 时,把 SBOM 与 Portable 等非 updater 资产
  # 追加到 tauri-action 已创建的 Release(softprops 按 tag 定位既有 Release,
  # 上传同名/新文件均为增量添加,不影响 latest.json 引用的资产)。
  # ──────────────────────────────────────────────────────────────────────────
  publish-extras:
    name: Publish extra assets
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download extra artifacts
        uses: actions/download-artifact@v6
        with:
          path: extras
          # 单一 glob(brace 展开):Portable 与 SBOM 全部落到 extras/ 根目录
          pattern: qraft-{portable,sbom}-*
          merge-multiple: true

      - name: Append files to release
        # 锁定 v2:v3 在 tag 与 Release.target_commitish 脱节(强移 tag 重跑)时
        # 会尝试 PATCH release 元数据,触发 Resource not accessible by integration
        uses: softprops/action-gh-release@v2
        with:
          files: extras/**/*
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # normalize-assets:tag 且非 dry-run 时,统一 Release 资产命名并同步重写
  # latest.json(设计见 prd/asset-naming-normalization/design.md)。
  #
  # updater 的下载 URL 必须与 Release 资产名逐字节一致,因此改名的同一步里
  # 必须回写 latest.json;顺序为先改资产名、后覆盖 latest.json(秒级窗口内
  # 检查更新可能 404,一次性可接受)。msi/rpm 已从 bundle.targets 移除,
  # 存量资产在此一并删除。Portable / SBOM / latest.json 本身不改名。
  # ──────────────────────────────────────────────────────────────────────────
  normalize-assets:
    name: Normalize release asset names
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rename assets & rewrite updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          # 版本号取自 tauri.conf.json(与 Windows Portable 打包同源),
          # 避免本地 conf 与 tag 名脱节导致映射落空。
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)

          # 旧名 → 新名映射。sed 对主文件名与配套 .sig 同样生效;
          # 注意 darwin 更新产物名不带版本号(Qraft_x64.app.tar.gz)。
          MAP_SED=(
            -e "s|Qraft_${VER}_x64-setup\.exe|Qraft-${VER}-Windows-Amd64-Setup.exe|g"
            -e "s|Qraft_${VER}_arm64-setup\.exe|Qraft-${VER}-Windows-Arm64-Setup.exe|g"
            -e "s|Qraft_x64\.app\.tar\.gz|Qraft-${VER}-MacOS-Amd64.app.tar.gz|g"
            -e "s|Qraft_aarch64\.app\.tar\.gz|Qraft-${VER}-MacOS-Arm64.app.tar.gz|g"
            -e "s|Qraft_${VER}_x64\.dmg|Qraft-${VER}-MacOS-Amd64.dmg|g"
            -e "s|Qraft_${VER}_aarch64\.dmg|Qraft-${VER}-MacOS-Arm64.dmg|g"
            -e "s|Qraft_${VER}_amd64\.deb|Qraft-${VER}-Linux-Amd64.deb|g"
            -e "s|Qraft_${VER}_arm64\.deb|Qraft-${VER}-Linux-Arm64.deb|g"
            -e "s|Qraft_${VER}_amd64\.AppImage|Qraft-${VER}-Linux-Amd64.AppImage|g"
            -e "s|Qraft_${VER}_aarch64\.AppImage|Qraft-${VER}-Linux-Arm64.AppImage|g"
          )

          # 全程走 Release ID 路由:删 tag 会把既有 Release 转为 draft,而
          # /releases/tags/{tag} 与 tag 型公开下载 URL 对 draft 均不可用(404),
          # 只有 /releases 列表能按 tag_name 命中 draft。资产增删改同理必须用
          # releases/{id}/assets 与 releases/assets/{asset_id} 端点。
          API="repos/{owner}/{repo}"

          RELEASE_ID=$(gh api "$API/releases" --paginate |
            jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)][0].id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: no release found for tag $TAG" >&2
            exit 1
          fi
          echo "release id: $RELEASE_ID"

          # 1) 资产改名(PATCH API 直接改,免重传);msi/rpm 不再产出,直接删除。
          # 先建 现有名 → id 映射:重跑场景下目标名可能已被上一轮占用
          # (GitHub PATCH 重名报 422),改前需先删掉旧的同名资产。
          declare -A EXISTING
          while IFS=$'\t' read -r aid aname; do EXISTING["$aname"]="$aid"; done < <(
            gh api "$API/releases/$RELEASE_ID/assets" --paginate |
              jq -r '.[] | "\(.id)\t\(.name)"'
          )

          for aname in "${!EXISTING[@]}"; do
            id="${EXISTING[$aname]}"
            new_name=$(printf '%s' "$aname" | sed "${MAP_SED[@]}")
            case "$new_name" in
              *.msi|*.msi.sig|*.rpm|*.rpm.sig)
                gh api -X DELETE "$API/releases/assets/$id" >/dev/null
                echo "deleted: $aname"
                ;;
              "$aname")
                echo "keep:    $aname"
                ;;
              *)
                if [ -n "${EXISTING[$new_name]:-}" ] && [ "${EXISTING[$new_name]}" != "$id" ]; then
                  gh api -X DELETE "$API/releases/assets/${EXISTING[$new_name]}" >/dev/null
                  echo "replaced stale: $new_name"
                fi
                gh api -X PATCH "$API/releases/assets/$id" -f name="$new_name" >/dev/null
                echo "renamed: $aname -> $new_name"
                ;;
            esac
          done

          # 2) 先取 updater manifest(必须在改名循环之前,否则资产重传/替换
          #    可能恰好在循环期间替换掉 latest.json,导致循环后取不到)。
          #    manifest 缺失时仅告警跳过,不中断(循环后若出现则照常重写)。
          MANIFEST_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
            jq -r '[.[] | select(.name == "latest.json")][0].id')
          HAS_MANIFEST=0
          if [ -n "$MANIFEST_ID" ] && [ "$MANIFEST_ID" != "null" ]; then
            gh api "$API/releases/assets/$MANIFEST_ID" \
              -H "Accept: application/octet-stream" > latest.json
            HAS_MANIFEST=1
          else
            echo "WARN: latest.json not found on release, skip manifest rewrite" >&2
          fi

          # 3) 重写 manifest:URL 文件名按同一映射替换,并剔除 msi/rpm 条目。
          if [ "$HAS_MANIFEST" = "1" ]; then
            sed -i "${MAP_SED[@]}" latest.json
            jq '.platforms |= with_entries(
                  select((.value.url | endswith(".msi") or endswith(".rpm")) | not)
                )' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json

            # 4) 覆盖写回(此步之后 URL 与资产名恢复逐字节一致)。
            # 循环期间 latest.json 可能被并发替换(换 id),按名重新定位;
            # 不存在则直接上传。
            CUR_ID=$(gh api "$API/releases/$RELEASE_ID/assets" --paginate |
              jq -r '[.[] | select(.name == "latest.json")][0].id')
            if [ -n "$CUR_ID" ] && [ "$CUR_ID" != "null" ]; then
              gh api -X DELETE "$API/releases/assets/$CUR_ID" >/dev/null
            fi
            gh api -X POST "$API/releases/$RELEASE_ID/assets?name=latest.json" \
              -H "Content-Type: application/octet-stream" \
              --input latest.json > /dev/null
            echo "---- final manifest ----"
            jq -r '.platforms | to_entries[] | "\(.key): \(.value.url)"' latest.json
          fi
